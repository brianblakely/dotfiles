# }

# listener {
#     timeout = 300                      # 5min
#     on-timeout = loginctl lock-session # lock screen when timeout has passed
# }

listener {
    timeout = 330                                                                    # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'              # turn the screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r # turn the screen on
}
